name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/production-preflight.mjs
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          JWT_SECRET: ci-secret-with-at-least-32-characters-long
          VITE_APP_ID: ci-app
          OAUTH_SERVER_URL: https://api.manus.im
          CANONICAL_ORIGIN: https://example.com
