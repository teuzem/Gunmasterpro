# Production Coolify (Contabo VPS) — GunsMasterPro.
# Déploiement : ressource "Docker Compose" pointée sur ce fichier.
# Les secrets sont injectés par l'interface Coolify (onglet Environment),
# JAMAIS commités. En local : `docker compose -f docker-compose.coolify.yml
# --env-file .env.production up -d --build` (copier .env.production.example).
# Base imposée : MySQL 8.4 (drizzle dialect mysql + driver mysql2).
# PostgreSQL est INCOMPATIBLE (preflight refuse tout DATABASE_URL non mysql://).
#
# MySQL n'est PAS déclaré ici : la base est une ressource MySQL gérée par
# Coolify (Project → New Resource → Database), qui apporte les sauvegardes
# planifiées et une interface de gestion. Voir l'étape 7 de DEPLOIEMENT-COOLIFY.md.
# Conséquence : le service `db` et le `depends_on` ont été retirés ; sans cette
# adaptation, `depends_on` porterait sur un service inexistant et le déploiement
# échouerait immédiatement.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant — voir .env.production.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant (≥32 caractères)}
      VITE_APP_ID: ${VITE_APP_ID:?VITE_APP_ID manquant}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:?OAUTH_SERVER_URL manquant}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:?OWNER_OPEN_ID manquant}
      OWNER_NAME: ${OWNER_NAME:-GunsMasterPro}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:?CANONICAL_ORIGIN manquant, ex. https://gunmaster-pro.com}
      SITE_NAME: ${SITE_NAME:-GunsMasterPro}
      # Requis en production : sans ces clés, /manus-storage/* ne sert rien et
      # le catalogue affiche le repli SVG au lieu des visuels.
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      # Stockage des médias : "local" écrit dans le volume persistant et sert
      # /media/* ; "forge" utilise le bucket S3 de Manus (défaut si les clés
      # Forge sont présentes et que MEDIA_STORAGE_MODE n'est pas fixé).
      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-local}
      LOCAL_MEDIA_DIR: /app/data/media
      # Jeton de l'import massif de médias (POST /api/media-import/*).
      # Sans cette variable, la route est désactivée.
      MEDIA_IMPORT_TOKEN: ${MEDIA_IMPORT_TOKEN:-}
    volumes:
      - gmp_media:/app/data/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  gmp_media:
