# Production Coolify (Contabo VPS) — GunsMasterPro.
# Déploiement : ressource "Docker Compose" pointée sur ce fichier.
# Les secrets sont injectés par l'interface Coolify (onglet Environment),
# JAMAIS commités. En local : `docker compose -f docker-compose.coolify.yml
# --env-file .env.production up -d --build` (copier .env.production.example).
# Base imposée : MySQL 8.4 (drizzle dialect mysql + driver mysql2).
# PostgreSQL est INCOMPATIBLE (preflight refuse tout DATABASE_URL non mysql://).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant — voir .env.production.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant (≥32 caractères)}
      VITE_APP_ID: ${VITE_APP_ID:?VITE_APP_ID manquant}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:?OAUTH_SERVER_URL manquant}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:?OWNER_OPEN_ID manquant}
      OWNER_NAME: ${OWNER_NAME:-GunsMasterPro}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:?CANONICAL_ORIGIN manquant, ex. https://votre-domaine.tld}
      SITE_NAME: ${SITE_NAME:-GunsMasterPro}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      LOCAL_MEDIA_DIR: /app/data/media
    volumes:
      - gmp_media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Pas de ports publiés : la BD reste sur le réseau interne Coolify.
    expose:
      - "3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: gunsmasterpro
      MYSQL_USER: gunsmasterpro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant}
    volumes:
      - gunsmasterpro_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  gunsmasterpro_db:
  gmp_media:
